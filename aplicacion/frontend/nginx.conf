server {
    # nginx-unprivileged no puede usar puertos menores a 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas de la aplicación: si el archivo no existe, sirve index.html
    # para que recargar la página no devuelva 404.
    location / {
        try_files $uri /index.html;
    }

    # index.html nunca se guarda en caché, así el navegador ve cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite pone un hash en el nombre de cada archivo de /assets,
    # así que pueden guardarse en caché sin riesgo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
