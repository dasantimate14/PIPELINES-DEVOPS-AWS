# Prueba local con la misma regla de rutas que el ALB.
# Uso: docker compose up --build  y abre http://localhost:8081
services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: local-backend

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: local-frontend

  gateway:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:8080"
    depends_on:
      - backend
      - frontend
