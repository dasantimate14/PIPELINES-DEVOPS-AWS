# Imita el ALB en local: /api/* al backend y lo demás al frontend.
# proxy_pass sin ruta final conserva la URL completa, igual que el ALB,
# así que el backend recibe /api/... y no /...
server {
    listen 8080;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }
}
